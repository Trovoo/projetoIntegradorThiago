<div class="produto-card">
  <h2>{{ nomeProduto }}</h2>
  <p><strong>Preço:</strong> R$ {{ preco.toFixed(2) }}</p>

  <div class="quantidade-control">
    <span><strong>Quantidade:</strong> {{ quantidade }} </span>
    
    <button (click)="diminuir()" [disabled]="quantidade === 1">-</button>
    <button (click)="aumentar()">+</button>
  </div>

  <p><strong>Total:</strong> R$ {{ calcularTotal().toFixed(2) }}</p>

  <button (click)="adicionarAoCarrinho()">Adicionar ao carrinho</button>

 @if (mensagem) {
    <p>{{ mensagem }}</p>
  }
</div>
