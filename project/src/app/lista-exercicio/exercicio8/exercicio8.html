<label>Nome:</label><br>
<input type="text" [(ngModel)]="name"><br>
<p>Nome digitado: {{ name }}</p>

<label>Quantidade:</label><br>
<input type="number" [(ngModel)]="quantidade"><br>
<p>Nome digitado: {{ quantidade }}</p>

<label>Preço:</label><br>
<input type="number" [(ngModel)]="preco"><br>
<p>Valor digitado: {{ preco }}, 00</p>

<label>Total:</label><br>
<p>Total: {{ total }}, 00</p>
